# Publishes the package to npm when a GitHub release is published, from main or develop. The
# release's tag must be the package.json version with a "v" (v0.0.3); otherwise the run fails and
# nothing is published. A version already on npm is skipped. `npm publish` runs `prepack`, which
# builds dist/ here on the runner; nothing built is committed.
#
# Auth is npm trusted publishing, so no token is stored: the package's Settings on npmjs.com →
# Trusted publishing → GitHub Actions, repository OneOneFour/rkui, workflow publish.yml.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - id: check
        name: Check the release tag matches package.json and isn't on npm yet
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The release tag is $GITHUB_REF_NAME but package.json says v$version."
            exit 1
          fi
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest
      - if: steps.check.outputs.publish == 'true'
        run: npm ci
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
